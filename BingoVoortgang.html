<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Bingo Voortgang</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="robots" content="noindex, nofollow">
</head>
<body>

  <div id="nav-placeholder"></div>

  <main class="admin-container">
    <h1>🏆 Organisatie Dashboard</h1>
    <h2>Live Bingo Voortgang Teamweekend 2026</h2>
    <p>Hieronder zie je real-time hoeveel en welke vakjes iedereen heeft afgestreept.</p>
    
    <hr class="admin-hr">

    <div id="dashboard-content">
      <div class="loading">Data live aan het ophalen uit Firebase... 🔄</div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

    // Firebase configuratie
    const firebaseConfig = {
        apiKey: "AIzaSyDfaQhcS4kNLCy1BPHxnmicLj_zxexjTAU",
        authDomain: "parkhout-2026.firebaseapp.com",
        projectId: "parkhout-2026",
        storageBucket: "parkhout-2026.firebasestorage.app",
        messagingSenderId: "286583232322",
        appId: "1:286583232322:web:9efcb22a61a8f7f1b4dadb",
        measurementId: "G-WR9S68PJ3G",
        databaseURL: "https://parkhout-2026-default-rtdb.europe-west1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Navigatie inladen
    fetch('nav.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('nav-placeholder').innerHTML = data;
      });

    const dashboardContent = document.getElementById('dashboard-content');
    const bingoCardsRef = ref(db, 'bingo_kaarten');

    // Live luisteren naar wijzigingen in de database
    onValue(bingoCardsRef, (snapshot) => {
        const allCards = snapshot.val();
        
        if (!allCards) {
            dashboardContent.innerHTML = "<p class='admin-empty'>Er zijn nog geen bingokaarten gegenereerd door spelers.</p>";
            return;
        }

        let html = "";

        // Loop door alle spelers heen (gesorteerd op naam)
        Object.keys(allCards).sort().forEach((player) => {
            const card = allCards[player];
            
            const totalItems = card.length;
            const checkedItems = card.filter(item => item.checked).length;
            
            html += `
                <div class="player-row">
                    <div class="player-header">
                        <h3 class="player-name">${player}</h3>
                        <span class="progress-badge">${checkedItems} / ${totalItems} Afgevinkt</span>
                    </div>
                    <div class="admin-grid">
            `;

            card.forEach((item) => {
                const isChecked = item.checked ? 'checked' : '';
                html += `
                    <div class="admin-item ${isChecked}" title="${item.info}">
                        ${item.tekst}
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;
        });

        dashboardContent.innerHTML = html;
    }, (error) => {
        console.error("Fout bij ophalen dashboard data:", error);
        dashboardContent.innerHTML = "<p class='admin-error'>Fout bij het laden van de voortgang.</p>";
    });
  </script>

</body>
</html>
