<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Bingo Voortgang</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="robots" content="noindex, nofollow">
</head>
<body>

  <div id="nav-placeholder"></div>

  <main class="admin-container">
    <div class="admin-header-container">
      <div>
        <h1>🏆 Organisatie Dashboard</h1>
        <h2>Live Bingo Voortgang Teamweekend 2026</h2>
      </div>
      <button id="logout-btn" class="logout-btn">Uitloggen</button>
    </div>

    <p>Hieronder zie je real-time de tussenstand en welke vakjes iedereen heeft afgestreept.</p>
    
    <div class="player-row" style="background: #002561; border: 2px solid #28a745;">
      <h3 style="margin-top: 0; color: #28a745;">📊 Live Tussenstand (Meeste punten + snelste tijd bovenaan)</h3>
      <ol id="leaderboard-list" style="margin: 0; padding-left: 0; list-style-type: none; font-size: 1.1rem; line-height: 1.6; font-weight: bold; text-transform: capitalize;">
        <li>Wachten op actieve spelers... ⏳</li>
      </ol>
    </div>

    <hr class="admin-hr">

    <div id="dashboard-content">
      <div class="loading">Data live aan het ophalen uit Firebase... 🔄</div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

    // Firebase configuratie
    const firebaseConfig = {
        apiKey: "AIzaSyDfaQhcS4kNLCy1BPHxnmicLj_zxexjTAU",
        authDomain: "parkhout-2026.firebaseapp.com",
        projectId: "parkhout-2026",
        storageBucket: "parkhout-2026.firebasestorage.app",
        messagingSenderId: "286583232322",
        appId: "1:286583232322:web:9efcb22a61a8f7f1b4dadb",
        measurementId: "G-WR9S68PJ3G",
        databaseURL: "https://parkhout-2026-default-rtdb.europe-west1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Navigatie inladen
    fetch('nav.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('nav-placeholder').innerHTML = data;
      });

    document.getElementById('logout-btn').addEventListener('click', () => {
        
        window.location.href = 'persoonlijk.html';  // Stuur de admin terug naar het inlogscherm
    });

    const leaderboardList = document.getElementById('leaderboard-list');
    const dashboardContent = document.getElementById('dashboard-content');
    const bingoCardsRef = ref(db, 'bingo_kaarten');

    // Live luisteren naar database wijzigingen
    onValue(bingoCardsRef, (snapshot) => {
        const allCards = snapshot.val();
        
        if (!allCards || Object.keys(allCards).length === 0) {
            dashboardContent.innerHTML = "<p class='admin-empty'>Er hebben nog geen spelers ingelogd. Zodra iemand inlogt, verschijnt hij hier live!</p>";
            leaderboardList.innerHTML = "<li>Nog geen active spelers beschikbaar</li>";
            return;
        }

        // 1. Bouw de spelerslijst op inclusief de 'lastTime' timestamp van het laatst behaalde punt
        const spelersLijst = Object.keys(allCards).map(player => {
            const card = allCards[player];
            
            // Check of de kaart een geldige array is
            if (card && Array.isArray(card)) {
                const checkedItems = card.filter(item => item.checked);
                
                // Zoek naar de nieuwste timestamp binnen de gecheckte vakjes van deze speler
                let laatstePuntTijd = 0;
                checkedItems.forEach(item => {
                    if (item.lastChanged && item.lastChanged > laatstePuntTijd) {
                        laatstePuntTijd = item.lastChanged;
                    }
                });

                return {
                    name: player,
                    score: checkedItems.length,
                    total: card.length,
                    lastTime: laatstePuntTijd,
                    cardData: card
                };
            }
            return null;
        }).filter(speler => speler !== null); // Filter eventuele corrupte data eruit

        // SLIMMERE SORTERING: Meeste punten bovenaan, bij gelijke stand wint de snelste tijd
        spelersLijst.sort((a, b) => {
            if (b.score !== a.score) {
                return b.score - a.score; // Sorteer op de hoogste score
            }
            if (a.score === 0 && b.score === 0) {
                return a.name.localeCompare(b.name); // Als iedereen 0 heeft, gewoon alfabetisch
            }
            return a.lastTime - b.lastTime; // Snelste tijd (laagste timestamp) komt bovenaan
        });

        // 2. Genereer de Live Tussenstand HTML (met strakke links-uitlijning)
        let leaderboardHtml = "";
        spelersLijst.forEach((speler, index) => {
            const positieNummer = index + 1;
            let medailleOfPositie = `${positieNummer}.`;
            
            if (positieNummer === 1 && speler.score > 0) medailleOfPositie = "🥇";
            if (positieNummer === 2 && speler.score > 0) medailleOfPositie = "🥈";
            if (positieNummer === 3 && speler.score > 0) medailleOfPositie = "🥉";
            
            leaderboardHtml += `
                <li style="display: flex; align-items: center; margin-bottom: 4px; padding-left: 10px;">
                    <span style="display: inline-block; width: 35px; text-align: left;">${medailleOfPositie}</span>
                    <span>${speler.name}: <span style="color: #28a745;">${speler.score}</span></span>
                </li>`;
        });
        leaderboardList.innerHTML = leaderboardHtml;

        // 3. Genereer de individuele kaarten hieronder
        let cardsHtml = "";
        spelersLijst.forEach((speler) => {
            cardsHtml += `
                <div class="player-row">
                    <div class="player-header">
                        <h3 class="player-name">${speler.name}</h3>
                        <span class="progress-badge">${speler.score} / ${speler.total} Afgevinkt</span>
                    </div>
                    <div class="admin-grid">
            `;

            speler.cardData.forEach((item) => {
                const isChecked = item.checked ? 'checked' : '';
                cardsHtml += `
                    <div class="admin-item ${isChecked}" title="${item.info}">
                        ${item.tekst}
                    </div>
                `;
            });

            cardsHtml += `
                    </div>
                </div>
            `;
        });

        dashboardContent.innerHTML = cardsHtml;
    }, (error) => {
        console.error("Fout bij ophalen dashboard data:", error);
        dashboardContent.innerHTML = "<p class='admin-error'>Fout bij het laden van de voortgang.</p>";
    });
  </script>

</body>
</html>
