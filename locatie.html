<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locatie</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="robots" content="noindex, nofollow">
</head>
<body>

  <div id="nav-placeholder"></div>

  <main>
    <h1>Locatie</h1>

    <div class="card">
      <h2>Locatie 🔒</h2>
      <p>De exacte locatie is nog niet onthuld.</p>

      <div class="hint-container">
        <!-- Eerste Hint -->
        <button id="btnHint1" class="reveal-btn">Reveal eerste hint</button>
        <div id="hint1" class="reveal-hint hidden">
          <p><strong>Hint 1:</strong> We hebben genoeg auto's nodig om er te komen.</p>
        </div>

        <!-- Tweede Hint -->
        <button id="btnHint2" class="reveal-btn" style="margin-top: 10px;">Reveal nog een hint</button>
        <div id="hint2" class="reveal-hint hidden">
          <p><strong>Hint 2:</strong> ID/Paspoort moet mee, let op rijbewijs niet voldoende.</p>
        </div>
      </div>
      <!-- 
        Hint: Braadworst foto/tekst
        Hint: Google translate kan van pas komen
        Hint: Logo van lokale voetbalclub, zonder tekst erin
        Hint: Je hoort er meer vogels dan verkeer
        Hint: Limburgse zin, dat lijkt op het vlaams
        Hint: Vlag limburg zonder leeuw of alleen foto van die leeuw in een vlag
        Hint laatste: Foto accommodatie
      -->
    </div>

    <div class="card">
      <h2>Kaart</h2>

      <div class="map-wrapper locked-map">
        <iframe
          src="https://maps.google.com/maps?q=Bad%20Bentheim,Germany&z=9&output=embed"
          loading="lazy"
          title="Verborgen kaart">
        </iframe>

        <div class="map-overlay">
          <span>Locatie nog geheim 🔒</span>
        </div>
      </div>
    </div>
  </main>
  
  <script>
    fetch('nav.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('nav-placeholder').innerHTML = data;
      });

    // Pak alle knoppen met de class 'reveal-btn'
    const revealButtons = document.querySelectorAll('.reveal-btn');

    revealButtons.forEach(btn => {
      btn.addEventListener('click', function() {
        // Zoek de hint die direct na deze knop komt in de HTML
        const hint = this.nextElementSibling;

        if (hint) {
          hint.classList.remove('hidden'); // Toon de hint
          this.disabled = true;           // Maak knop onklikbaar
          this.textContent = 'Hint onthuld'; // Verander de tekst
          this.classList.add('disabled-style'); // Optioneel: voor styling
        }
      });
    });
  </script>

</body>
</html>
