<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Persoonlijke pagina</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  
  <div id="nav-placeholder"></div>

  <main id="main-content"></main>

  <script>
    const main = document.getElementById('main-content');

    // Navbar laden
    fetch('nav.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('nav-placeholder').innerHTML = data;
      });

     // Functie: Inlogscherm tonen
    function showLoginForm() {
      main.innerHTML = `
        <div class="card login-form">
            <div class="map-wrapper locked-map">
            
                <div style="padding: 20px; filter: blur(10px); pointer-events: none;">
                  <h2>Mijn Persoonlijke Pagina</h2>
                    <input placeholder="Je naam (bijv. Jan)">
                    <input placeholder="Wachtwoord">
                    <button class="btn-primary">Open mijn pagina</button>
                </div>

                <div class="map-overlay">
                    <span>Nog geblokkeerd 🔒<br></span>
                </div>
            </div>
        </div>
      `;
    }

    
    showLoginForm();
  </script>

</body>
</html>
