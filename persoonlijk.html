    function showLoginForm() {
      main.innerHTML = `
        <div class="card login-form">
            <h2>Mijn Persoonlijke Pagina</h2>
            <h3>Lees de informatie HEEL GOED!!</h3>
            <input type="text" id="username" placeholder="Je naam (bijv. Jan)">

        </div>
      `;
      // Event listener toevoegen aan de knop (omdat inline onclick niet werkt met type="module")
      document.getElementById('login-btn').addEventListener('click', login);
    }

    // Functie: Inloggen verwerken via Firebase Database
    function login() {
        const user = document.getElementById('username').value.trim().toLowerCase();
        const pass = document.getElementById('password').value.trim();
        const errorEl = document.getElementById('error');

        if (!user || !pass) {
            errorEl.innerText = "Vul een naam en wachtwoord in!";
            errorEl.style.display = 'block';
            return;
        }

        // Verwijzing naar het specifieke wachtwoord van deze gebruiker in Firebase
        const passwordRef = ref(db, 'team_wachtwoorden/' + user);

        // Haal het wachtwoord live op uit de database
        get(passwordRef).then((snapshot) => {
            const correctWachtwoord = snapshot.val();

            // Controleer of de gebruiker bestaat EN of het wachtwoord klopt
            if (correctWachtwoord && correctWachtwoord === pass) {
                if (user === 'admin'){
                    window.location.href = 'BingoVoortgang.html';
                } else {
                    localStorage.setItem('bingoUser', user);
                    showBingo(user);
                }
                
            } else {
                errorEl.innerText = "Naam of wachtwoord onjuist!";
                errorEl.style.display = 'block';
            }
        }).catch((err) => {
            console.error("Firebase login error:", err);
            errorEl.innerText = "Fout bij verbinden met de database.";
            errorEl.style.display = 'block';
        });
    }

                const startItems = specifiek[user] || [];

                while (mijnKaart.length < 9) {
                    let randomItem = algemeen[Math.floor(Math.random() * algemeen.length)];
                    if (!mijnKaart.some(e => e.tekst === randomItem.tekst)) {
                        mijnKaart.push({ ...randomItem, checked: false });

                }

                mijnKaart.sort(() => Math.random() - 0.5);

                const userCardRef = ref(db, 'bingo_kaarten/' + user);
                set(userCardRef, mijnKaart);
            }
        }).catch(err => {
            console.error("Firebase live stream error: ", err);
        });

    // Toggle functie aangepast: Alleen opslaan in Firebase. 
    // Omdat showBingo live luistert via onValue, ververst het scherm nu automatisch!
    window.toggleVakje = function(index) {
        const user = localStorage.getItem('bingoUser');
        const userCardRef = ref(db, 'bingo_kaarten/' + user);

        get(userCardRef).then((snapshot) => {
            let kaart = snapshot.val();
            if (kaart && kaart[index]) {
                // Wissel de status van het vakje
                kaart[index].checked = !kaart[index].checked;
                
                // NIEUW: Sla de exacte tijd op als hij gecheckt wordt, anders wissen
                if (kaart[index].checked) {
                    kaart[index].lastChanged = Date.now(); // Tijdstip in milliseconden
                } else {
                    delete kaart[index].lastChanged;
                }
                
                set(userCardRef, kaart);
            }
        });
    };
