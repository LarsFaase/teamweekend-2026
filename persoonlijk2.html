<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Persoonlijke pagina</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  
  <div id="nav-placeholder"></div>

  <main id="main-content"></main>

  <!-- De Video Container -->
  <div id="video-container">
    <video id="myVideo">
      <source src="pictures/video.mp4" type="video/mp4">
    </video>
  </div>

  <script>
    const main = document.getElementById('main-content');

    // Navbar laden
    fetch('nav.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('nav-placeholder').innerHTML = data;
      });

      // Functie om video te starten met geluid
    function playSecretVideo() {
      const video = document.getElementById('myVideo');
      const container = document.getElementById('video-container');
      
      container.style.display = 'block'; // Toon de video
      video.muted = false; // Zet geluid aan
      video.play(); // Start de video
    }

    document.getElementById('myVideo').onended = function() {
        document.getElementById('video-container').style.display = 'none';
    };

     // Functie: Inlogscherm tonen
    function showLoginForm() {
      main.innerHTML = `
        <div class="card login-form">
            <h2>Mijn Persoonlijke Pagina</h2>
            
            <input type="text" id="username" placeholder="Je naam (bijv. Jan)">
            <input type="password" id="password" placeholder="Wachtwoord">
            <button onclick="login()" class="btn-primary">Open mijn pagina</button>
            <p id="error" style="color:red; display:none;">Verkeerd wachtwoord!</p>

            ` + /* `
            <div class="map-wrapper locked-map">
                <div style="padding: 20px; filter: blur(5px); pointer-events: none;">
                    <input type="text" placeholder="Gebruikersnaam" disabled>
                    <input type="password" placeholder="Wachtwoord" disabled>
                    <button class="btn-primary" disabled>Inloggen</button>
                </div>

                <div class="map-overlay">
                    <span>Nog geblokkeerd 🔒<br></span>
                </div>
            </div>
            */ `
        </div>
      `;
    }

    // Functie: Inloggen verwerken
    function login() {
        const user = document.getElementById('username').value.trim().toLowerCase();
        const pass = document.getElementById('password').value.trim();

        // Het Wachtwoordenboek
        const teamLeden = {
            "julian": "julian1",
            "tycho": "tycho2",
            "fabio": "fabio3",
            "lars": "lars4",
            "franck": "franck5",
            "sten": "sten6",
            "john": "john7",
            "marco": "marco8",
            "matej": "matej9",
            "lennart": "lennart10",
            "marijn": "marijn11",
            "marlon": "marlon12",
            "robin": "robin13",
            "ryan": "ryan14",
            "sven": "sven15",
            "jesper": "jesper16",
            "tom": "tom17",
            "tim": "tim18",
            "wout": "wout19",
            "sander": "sander20",
            "lorenzo": "lorenzo21",
            "jim": "jim22"
        };

        // Controleer of de gebruiker bestaat EN of het wachtwoord klopt
        if (teamLeden[user] && teamLeden[user] === pass) {
            playSecretVideo();
        } else {
            const error = document.getElementById('error');
            error.innerText = "Naam of wachtwoord onjuist!";
            error.style.display = 'block';
        }
    }
    
    showLoginForm();
  </script>

</body>
</html>
