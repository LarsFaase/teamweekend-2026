<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teamweekend 2026</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="robots" content="noindex, nofollow">
</head>
<body>

  <div id="nav-placeholder"></div>

  <main id="main-content">
    <h1>Programma</h1>
    <h3>We gaan natuurlijk nog niet het hele programma vrijgeven. Maar we willen jullie wel alvast een klein overzicht geven met een aantal hints over de activiteiten!</h3>
    <!-- Knop om de video mét geluid te triggeren -->
    <button class="reveal-btn" onclick="playSecretVideo()">Reveal hints</button>
  </main>

  <!-- De Video Container -->
  <div id="video-container">
    <video id="myVideo">
      <source src="pictures/video.mp4" type="video/mp4">
    </video>
  </div>

  <script>
    // Navbar laden
    fetch('nav.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('nav-placeholder').innerHTML = data;
      });

      // Functie om video te starten met geluid
    function playSecretVideo() {
      const video = document.getElementById('myVideo');
      const container = document.getElementById('video-container');
      
      container.style.display = 'block'; // Toon de video
      video.muted = false; // Zet geluid aan
      video.play(); // Start de video
    }

    document.getElementById('myVideo').onended = function() {
        document.getElementById('video-container').style.display = 'none';
    };
  </script>

</body>
</html>
